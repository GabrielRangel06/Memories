kind = "video"
videoAspectRatio = "16:9"
previewPath = "/"
title = "Fati Memory Film"
description = "A short memory film built from the uploaded screenshots and the supplied soundtrack."
version = "1.0.0"
id = "artifacts/fati-memory-film"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25482

[services.development]
run = "pnpm --filter @workspace/fati-memory-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fati-memory-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/fati-memory-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25482"
BASE_PATH = "/"
